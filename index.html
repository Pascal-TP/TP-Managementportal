<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TP-Managementportal · Demo V0.3</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="toast" class="toast" aria-live="polite"></div>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo"><img src="assets/tp.png" alt="TP Logo"></div>
        <div class="brand-copy"><strong>TP Holding GmbH</strong><span>Managementportal</span></div>
      </div>
      <div class="role-heading">Managementsystem</div>
      <nav id="main-nav" class="main-nav"></nav>
      <div class="sidebar-footer">
        <div class="view-switch" aria-label="Demo-Ansicht wechseln">
          <div class="view-switch-label">Demo-Ansicht</div>
          <div class="view-switch-buttons">
            <button class="view-switch-btn active" id="switch-full" type="button">Volle Ansicht</button>
            <button class="view-switch-btn" id="switch-employee" type="button">Mitarbeiter</button>
          </div>
        </div>
        <button class="sidebar-action" data-page="settings">⚙ Systemeinstellungen</button>
        <button class="sidebar-action">Abmelden</button>
        <div class="tool-release">TP-Managementportal · Demo V0.3</div>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <div><h1 id="page-title">Dashboard</h1><p id="page-subtitle">Zentrale Übersicht des integrierten Managementsystems.</p></div>
        <div class="topbar-actions">
          <button class="topbar-help-btn" id="demo-info"><span>i</span> Demo-Info</button>
          <div class="user-chip"><div class="avatar" id="user-avatar">PG</div><div><strong id="user-name">Pascal Gasch</strong><span id="user-role">IMS-Administrator</span></div></div>
        </div>
      </header>
      <section id="content" class="content"></section>
    </main>
  </div>
  <dialog id="modal"><div id="modal-content"></div></dialog>
  <script src="js/app.js"></script>
</body>
</html>
