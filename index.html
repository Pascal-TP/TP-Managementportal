<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TP-Managementportal · V1.0</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="toast" class="toast" aria-live="polite"></div>

  <section id="login-page" class="login-page">
    <div class="login-card">
      <div class="login-brand">
        <img src="assets/tp.png" alt="TP Logo">
        <div><strong>TP-Managementportal</strong><span>Version 1.0</span></div>
      </div>
      <h1>Anmelden</h1>
      <p class="muted">Bitte mit denselben Zugangsdaten wie im TP-Personalmanagement anmelden.</p>
      <form id="login-form" class="stack-form">
        <label>Anmeldename<input id="login-identifier" type="text" autocomplete="username" placeholder="name@firma.de oder benutzername" required></label>
        <label>Passwort<input id="login-password" type="password" autocomplete="current-password" required></label>
        <button class="btn primary" type="submit">Anmelden</button>
        <button class="btn secondary" id="forgot-password-btn" type="button">Passwort vergessen</button>
        <p id="login-message" class="message"></p>
      </form>
    </div>
  </section>
  <div id="app-shell" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo"><img src="assets/tp.png" alt="TP Logo"></div>
        <div class="brand-copy"><strong>TP Holding GmbH</strong><span>Managementportal</span></div>
      </div>
      <div class="role-heading">Managementsystem</div>
      <nav id="main-nav" class="main-nav"></nav>
      <div class="sidebar-footer">
        <button class="sidebar-action" id="personalmanagement-link">↗ TP-Personalmanagement</button>
        <button class="sidebar-action" id="settings-link" data-page="settings">⚙ Systemeinstellungen</button>
        <button class="sidebar-action" id="logout-btn">Abmelden</button>
        <div class="tool-release">TP-Managementportal · V1.0</div>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <div><h1 id="page-title">Dashboard</h1><p id="page-subtitle">Zentrale Übersicht des integrierten Managementsystems.</p></div>
        <div class="topbar-actions">
          <button class="topbar-help-btn" id="portal-info"><span>?</span> Hilfe</button>
          <div class="user-chip"><div class="avatar" id="user-avatar">PG</div><div><strong id="user-name">Pascal Gasch</strong><span id="user-role">IMS-Administrator</span></div></div>
        </div>
      </header>
      <section id="content" class="content"></section>
    </main>
  </div>
  <dialog id="modal"><div id="modal-content"></div></dialog>
  <script type="module" src="js/app.js"></script>
</body>
</html>
